name: Update championship probabilities
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forecast-refresh
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Acquire historical inputs
        run: |
          python scripts/fetch_reference.py
          python scripts/fetch_logs.py
          python data_pipeline.py
      - name: Train and refresh the primary model
        run: |
          python train.py
          python -c "import live; live.refresh(); print('Primary forecast refreshed successfully')"
          python scripts/publish_forecast.py --snapshot data/live_snapshot.json
      - name: Compute injury-adjusted scenario
        continue-on-error: true
        run: python -c "import json,injury_live; from pathlib import Path; injury_live.forecast(json.loads(Path('data/live_snapshot.json').read_text()),force=True)"
      - name: Prepare uncertainty inputs
        continue-on-error: true
        run: |
          python experiments/player_minutes/fetch.py
          python -c "from experiments.team_uncertainty.decision_check.common import research; research.build()"
      - name: Compute uncertainty and recovery stress scenarios
        continue-on-error: true
        run: |
          python -c "import json,experimental_live,injury_uncertainty; from pathlib import Path; p=json.loads(Path('data/live_snapshot.json').read_text()); experimental_live.forecast(p); injury_uncertainty.forecast(p)"
      - name: Publish aligned experimental outputs
        run: python scripts/publish_experiments.py --data-dir data --primary data/live_snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-forecast
          path: |
            reports/forecast.json
            reports/experimental_forecasts.json
          retention-days: 1
  publish:
    needs: forecast
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: public-forecast
          path: reports
      - name: Render the latest README
        run: python scripts/publish_forecast.py --snapshot reports/forecast.json
      - name: Commit updated probabilities
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md reports/forecast.json reports/title_probabilities.svg reports/experimental_forecasts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update championship probabilities'
            git push origin HEAD:main
          fi
